[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xau30-research"
version = "1.0.0"
description = "Leakage-resistant XAUUSD 30-minute direction research toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
xauusd = "xauusd.cli:main"

[tool.setuptools.packages.find]
include = ["xauusd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
